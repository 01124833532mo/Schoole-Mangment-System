<br>
<a [routerLink]="['/students/add']"> Student Add </a>
<div>
    <button class="btn btn-secondary" (click)="prevPage()">Prev</button>
    <span>Page {{pageNumber()}} / {{totalPages()}}</span>
    <button class="btn btn-secondary" (click)="nextPage()">Next</button>
    <label>
        Page size
        <select (change)="onPageSizeChange($any($event.target).value)">
            <option [value]="5">5</option>
            <option [value]="10" selected>10</option>
            <option [value]="20">20</option>
            <option [value]="50">50</option>
        </select>
    </label>
</div>
<div
    class="table-responsive"
>
    <table
        class="table table-striped table-hover table-borderless table-primary align-middle"
    >
        <thead class="table-light">
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody class="table-group-divider">

            @for (item of students(); track item.id) {
            <tr
                class="table-primary"
            >
                <td scope="row">{{item.id}}</td>
                <td>{{item.name}}</td>
                <td>{{item.age}}</td>
                <td>
                  <a [routerLink]="['/students/details',item.id]" class="btn btn-info">Student Details</a>
                                    <button class="btn btn-danger" (click)="deleteStudent(item.id)">Delete</button>
                </td>
            </tr>
        }
        </tbody>
        <tfoot>

        </tfoot>
    </table>
</div>

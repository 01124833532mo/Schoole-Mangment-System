
<header class="top-header">
  <nav class="navbar navbar-expand-lg app-navbar">
    <div class="container-fluid">
      <a class="navbar-brand brand" routerLink="/home">
        <span class="brand-mark">DM</span>
        <span>Demo Manager</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 nav-links">
          <li class="nav-item">
            <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/students" routerLinkActive="active">Students</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/departments" routerLinkActive="active">Departments</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/courses" routerLinkActive="active">Courses</a>
          </li>

          @if (accSer.isLogged()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/about" routerLinkActive="active">About</a>
            </li>
          }
        </ul>

        <div class="auth-actions">
          @if (!accSer.isLogged()) {
            <a class="btn btn-sm btn-outline-light" routerLink="/login">Login</a>
            <a class="btn btn-sm btn-light" routerLink="/register">Register</a>
          } @else {
            <span class="user-pill">{{ accSer.username() || 'User' }}</span>
          }
        </div>
      </div>
    </div>
  </nav>
</header>

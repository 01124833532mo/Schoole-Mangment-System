<section class="auth-wrap">
	<form class="auth-card" [formGroup]="loginForm" (ngSubmit)="login()">
		<h2>Login</h2>

		<label>Email</label>
		<input type="email" formControlName="email" class="form-control" />
		@if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
			<small class="text-danger">Enter a valid email.</small>
		}

		<label>Password</label>
		<input type="password" formControlName="password" class="form-control" />
		@if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
			<small class="text-danger">Password must be at least 6 characters.</small>
		}

		<button class="btn btn-primary" type="submit">Login</button>

		@if (errorMessage()) {
			<p class="text-danger mt-2">{{errorMessage()}}</p>
		}
	</form>
</section>
